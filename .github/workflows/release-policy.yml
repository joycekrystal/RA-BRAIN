name: Release policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run repository tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Validate release against PR target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/validate_release.py --base "$BASE_SHA"
